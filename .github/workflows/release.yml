name: Dokkaebi approved release

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Reviewed artifact release request committed on main'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dokkaebi-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.gate.outputs.run_id }}
      artifact: ${{ steps.gate.outputs.artifact }}
      bootstrap: ${{ steps.gate.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify request, build provenance and owner approval configuration
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
        run: python scripts/release_gate.py "$REQUEST"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the approved Windows build without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact }}
          path: approved-artifact
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download matching host transition artifact
        if: needs.preflight.outputs.bootstrap != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.bootstrap }}
          path: approved-bootstrap
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recheck approval policy and SHA then publish complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
        run: python scripts/publish_release.py "$REQUEST" approved-artifact
